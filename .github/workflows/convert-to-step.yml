name: Convert to STEP

on:
  workflow_call:
    inputs:
      detector_configs:
        required: true
        type: string

jobs:
  convert-to-step:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: build-gcc-nightly-fast-eic-shell
        path: install/
    - uses: cvmfs-contrib/github-action-cvmfs@v5
    - uses: eic/run-cvmfs-osg-eic-shell@main
      with:
        platform-release: "eic_xl:nightly"
        setup: install/bin/thisepic.sh
        run: |
          export DETECTOR_CACHE=/opt/detector/epic-main/share/epic
          IFS=, read -a configs <<< "${{inputs.detector_configs}}"
          overall_rc=0
          # For some reason npdet_to_step really wants a space in IFS
          IFS=$' \n\t'
          for config in ${configs[@]} ; do
            echo "::group::${config}" ;
            # First get all detectors (except world)
            unset detectors
            declare -A detectors
            while IFS= read -r d; do detectors["$d"]='-l 3'; done < <(npdet_to_step list "$DETECTOR_PATH/${config}.xml" | sed -n '/world/d; s/.*(vol: \(.*\)).*/\1/p')
            # Then tweak the levels (default is 1)
            detectors[EcalBarrelImaging]='-l 4'
            detectors[HcalBarrel]='-l 1'
            detectors[LFHCAL]='-l 2'
            detectors[OuterBarrelMPGDSubAssembly]='-l 4'
            # Export to one STEP file
            npdet_to_step $(for d in ${!detectors[@]} ; do echo part ${detectors[$d]} $d ; done) -o ${config} $DETECTOR_PATH/${config}.xml 2>&1 | sed '/TGeoMatrix::dtor/d'
            echo "::endgroup::" ;
            if [ ! -s ${config}.stp ] ; then
              echo "::error::No STEP file produced for ${config}"
              overall_rc=1
            fi
          done
          exit $overall_rc
    - uses: actions/upload-artifact@v7
      with:
        name: step
        path: "*.stp"
        if-no-files-found: error
